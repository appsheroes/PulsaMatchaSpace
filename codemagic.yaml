workflows:
  ios-workflow:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: SaveProgressKeeper-Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mikhailBirman.saveProgressKeeper
      vars:
        XCODE_PROJECT: "SaveProgressKeeper.xcodeproj"
        XCODE_SCHEME: "SaveProgressKeeper"
        BUNDLE_ID: "com.mikhailBirman.saveProgressKeeper"
        APP_STORE_APPLE_ID: 6778756302
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - chrissetzfuncslide@gmail.com
        notify:
          success: true
          failure: true
